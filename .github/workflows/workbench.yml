# Recoil Workbench: keeps the workbench itself healthy on every change to it.
# (Running scenarios needs a GPU and the game; see tools/workbench/README.md.)
name: Workbench
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/workbench/**
      - cont/base/springcontent/workbench/**
      - rts/System/Workbench/**
      - rts/Lua/LuaWorkbench.*
      - rts/System/Input/KeyInput.*
      - test/engine/System/testWorkbench.cpp
      - test/engine/System/Input/**
      - .github/workflows/workbench.yml
  push:
    branches:
      - master
    paths:
      - tools/workbench/**
      - cont/base/springcontent/workbench/**
      - rts/System/Workbench/**
      - rts/Lua/LuaWorkbench.*
      - rts/System/Input/KeyInput.*
      - test/engine/System/testWorkbench.cpp
      - test/engine/System/Input/**
      - .github/workflows/workbench.yml
jobs:
  runner:
    name: Runner and report tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/workbench/tests -v

  harness-lua:
    name: Harness and scenarios parse (Lua 5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: find cont/base/springcontent/workbench -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

  unit-tests:
    name: C++ unit tests (test_Workbench, test_KeyInput)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: docker-build-v2/build.sh --configure linux -DCMAKE_BUILD_TYPE=RELWITHDEBINFO
      - name: Build tests
        run: docker-build-v2/build.sh --compile linux -t test_Workbench -t test_KeyInput
      - name: Run tests in the build image
        run: |
          source docker-build-v2/images_versions.sh
          IMAGE="ghcr.io/beyond-all-reason/recoil-build-amd64-linux@${image_version[amd64-linux]}"
          for t in test_Workbench test_KeyInput; do
            docker run --rm -v "$PWD/build-amd64-linux:/build/out:ro" "$IMAGE" "/build/out/test/$t"
          done
